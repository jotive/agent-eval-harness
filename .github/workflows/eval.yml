name: agent-eval

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  # Live regression gate. Needs an OPENAI_API_KEY secret and a committed
  # baseline (baselines/main.json, created with `agent-eval run --out ...`).
  # Manual trigger so the public repo's push CI stays green without a key.
  eval-gate:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Run eval against baseline (fails on regression)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          agent-eval run \
            --dataset datasets/example.yaml \
            --out report.json \
            --baseline baselines/main.json \
            --max-drop 0.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: report.json
